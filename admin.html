<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader Study Admin</title>
<style>
:root{--bg:#f2f2f2;--s:#fff;--l:#d8d8d8;--t:#1c1c1c;--m:#666;--ok:#1f7a45;--no:#b3261e;--hi:#2b4c7e;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1b;--s:#262626;--l:#3e3e3e;--t:#eee;--m:#aaa;--ok:#7bc896;--no:#f08b84;--hi:#8fb0e0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1b1b;--s:#262626;--l:#3e3e3e;--t:#eee;--m:#aaa;--ok:#7bc896;--no:#f08b84;--hi:#8fb0e0;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.5 "Pretendard","Noto Sans KR",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--s);border-bottom:1px solid var(--l);padding:10px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
h1{font-size:16px;margin:0 12px 0 0}.warn{color:var(--no);font-weight:600;font-size:12px}
select,input{font:inherit;padding:4px 6px;border:1px solid var(--l);border-radius:5px;background:var(--s);color:var(--t)}
main{padding:12px 16px;display:flex;flex-direction:column;gap:12px;max-width:1500px;margin:0 auto}
.sum{background:var(--s);border:1px solid var(--l);border-radius:8px;padding:10px 14px;overflow-x:auto}
.sum table{border-collapse:collapse}.sum td,.sum th{padding:3px 10px;text-align:right;border-bottom:1px solid var(--l);white-space:nowrap}.sum th:first-child,.sum td:first-child{text-align:left}
.card{background:var(--s);border:1px solid var(--l);border-radius:8px;padding:12px 14px}
.ch{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:8px}.ch b{font-size:15px}.tag{font-size:12px;padding:1px 8px;border:1px solid var(--l);border-radius:99px;color:var(--m)}
.grid{display:grid;grid-template-columns:200px 1fr 1fr;gap:12px}
.q img{width:100%;border:1px solid var(--l);border-radius:4px;background:#fff}
.set{border:1px solid var(--l);border-radius:6px;padding:8px}.set.pref{border-color:var(--hi);box-shadow:inset 0 0 0 1px var(--hi)}
.sh{display:flex;justify-content:space-between;gap:6px;margin-bottom:6px;flex-wrap:wrap}.sh b{font-size:14px}
.sl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.sl figure{margin:0}.sl img{width:100%;height:70px;object-fit:contain;background:#fff;border:1px solid var(--l);border-radius:3px;cursor:zoom-in}
.sl figcaption{font-size:10.5px;color:var(--m);word-break:break-all;line-height:1.25}
.resp{margin-top:8px;border-collapse:collapse;font-size:13px}.resp td,.resp th{padding:3px 10px;border-bottom:1px solid var(--l);text-align:left}
.y{color:var(--ok);font-weight:600}.n{color:var(--no);font-weight:600}.muted{color:var(--m)}
dialog{border:0;padding:0;background:transparent;max-width:95vw}dialog img{max-width:95vw;max-height:80vh;display:block;background:#fff}
dialog .pp{display:flex;gap:6px;margin-top:6px}dialog .pp img{width:24vw;max-width:300px;height:auto}dialog::backdrop{background:rgba(0,0,0,.7)}
@media (max-width:900px){.grid{grid-template-columns:1fr}.sl{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body>
<div id="gate" style="min-height:70vh;display:grid;place-items:center"><form id="gf" style="background:var(--s);border:1px solid var(--l);border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:10px;width:min(360px,100%)">
<b style="font-size:16px">연구자 결과 페이지</b><span class="muted" style="font-size:13px">관리자 비밀번호를 입력하세요.</span>
<input id="gpw" type="password" autocomplete="current-password" required><button style="font:inherit;padding:7px;border-radius:6px;border:1px solid var(--hi);background:var(--hi);color:#fff;cursor:pointer">열기</button>
<span id="gerr" style="color:var(--no);font-size:13px"></span></form></div><div id="app" hidden><header><h1>Reader Study 결과 (언블라인드)</h1><span class="warn">⚠ 연구자 전용 · 병리의에게 공유 금지</span>
<label>시스템 <select id="fSys"><option value="">전체</option></select></label>
<label>진단 <select id="fDx"><option value="">전체</option></select></label>
<label>|ΔL2a| <select id="fBin"><option value="">전체</option><option>small</option><option>medium</option><option>large</option></select></label>
<label>응답 <select id="fResp"><option value="">전체</option><option value="has">응답 있음</option><option value="agree1">Q1 일치</option><option value="dis1">Q1 불일치</option><option value="agree2">Q2 일치</option><option value="dis2">Q2 불일치</option></select></label>
<label>검색 <input id="fTxt" placeholder="TCGA ID / item ID"></label><span id="cnt" class="muted"></span><button id="reload" style="font:inherit;padding:4px 10px;border:1px solid var(--l);border-radius:5px;background:var(--s);color:var(--t);cursor:pointer">새로고침</button></header>
<main><div class="sum" id="prog"></div><div class="sum" id="sum"></div><div id="list"></div></main>
</div><dialog id="dlg"></dialog>
<script>
let D=[];
const API='https://osqcbtjzmzgxiwxxoafm.supabase.co/rest/v1/rpc/rs_admin_dump', KEY='sb_publishable_KM6kIPtPfooQulEE_PnO4A_2O3c-xBw';
async function load(pw){
  const r=await fetch(API,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({p_pw:pw})});
  const j=await r.json(); if(!r.ok) throw new Error(j.message||r.status); if(j===null) throw new Error('invalid admin password');
  const label=Object.fromEntries(j.readers.map(x=>[x.code,x.label||x.code]));
  const by={}; for(const x of j.responses){(by[x.item_id]??=[]).push({reader:label[x.reader]||x.reader,q1:x.q1||'',q1_conf:x.q1_conf||'',q2:x.q2||'',q2_conf:x.q2_conf||'',sec:Math.round((x.time_ms||0)/1000),at:x.updated_at});}
  D=j.key.sort((a,b)=>a.seq-b.seq).map(it=>({...it,resp:(by[it.id]||[]).filter(r=>r.q1||r.q2)}));
  // progress per reader
  const prog=j.readers.map(rd=>{const rs=j.responses.filter(x=>x.reader===rd.code);const done=rs.filter(x=>x.q1&&x.q2).length;
    const last=rs.map(x=>x.updated_at).sort().pop();return `<tr><td>${esc(rd.label||rd.code)}</td><td><code>${esc(rd.code)}</code></td><td>${done} / ${j.key.length}</td><td>${last?new Date(last).toLocaleString('ko-KR'):'—'}</td></tr>`;}).join('');
  document.getElementById('prog').innerHTML=`<table><tr><th>판독자</th><th>코드</th><th>완료</th><th>마지막 저장</th></tr>${prog}</table>`;
}

const L={A:"A",B:"B",both_yes:"둘 다 (맞음/유용)",both_no:"둘 다 아님",'':'—'};
const im=(id,f)=>`img/${id}/${f}.webp`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sysName=(it,ans)=>ans==='A'||ans==='B'?it[ans].system:'';
function verdict(it,ans){if(ans!=='A'&&ans!=='B')return '<span class="muted">—</span>';return ans===it.pref?'<span class="y">일치</span>':'<span class="n">불일치</span>';}

function summary(){
  const by={};
  for(const it of D)for(const r of it.resp){const o=by[r.reader]??={n:0,q1:[0,0],q2:[0,0],q1o:{both_yes:0,both_no:0},q2o:{both_yes:0,both_no:0}};o.n++;
    for(const q of['q1','q2']){const a=r[q];if(a==='A'||a==='B'){o[q][1]++;if(a===it.pref)o[q][0]++;}else if(a)o[q+'o'][a]++;}}
  const pct=([k,n])=>n?`${k}/${n} (${(100*k/n).toFixed(1)}%)`:'—';
  const rows=Object.entries(by).map(([r,o])=>`<tr><td>${esc(r)}</td><td>${o.n}</td><td>${pct(o.q1)}</td><td>${o.q1o.both_yes}/${o.q1o.both_no}</td><td>${pct(o.q2)}</td><td>${o.q2o.both_yes}/${o.q2o.both_no}</td></tr>`).join('');
  // per-system win rate in Q1 (decisive answers)
  const w={};for(const it of D)for(const r of it.resp){if(r.q1!=='A'&&r.q1!=='B')continue;const win=it[r.q1].system,lose=it[r.q1==='A'?'B':'A'].system;(w[win]??={w:0,n:0}).w++;w[win].n++;(w[lose]??={w:0,n:0}).n++;}
  const wr=Object.entries(w).sort((a,b)=>b[1].w/b[1].n-a[1].w/a[1].n).map(([s,o])=>`${esc(s)} ${o.w}/${o.n}`).join(' · ');
  sum.innerHTML=rows?`<table><tr><th>판독자</th><th>응답 문항</th><th>Q1 ↔ Layer2a 일치</th><th>Q1 둘다맞음/둘다틀림</th><th>Q2 ↔ Layer2a 일치</th><th>Q2 둘다유용/둘다아님</th></tr>${rows}</table><div class="muted" style="margin-top:6px">Q1 시스템별 선택률(이긴 횟수/비교된 횟수): ${wr}</div>`:'<span class="muted">아직 응답이 없습니다. 판독이 시작되면 새로고침을 눌러 주세요.</span>';
}
function setHtml(it,s){
  const x=it[s];
  return `<div class="set ${it.pref===s?'pref':''}"><div class="sh"><b>Set ${s} · ${esc(x.system)}</b><span>L2a ${x.l2a.toFixed(4)}${it.pref===s?' ★':''}</span></div>
  <div class="sl">${x.slides.map((sl,i)=>`<figure><img loading="lazy" src="${im(sl.img,'thumb')}" data-img="${sl.img}" data-cap="${esc(`${s}-${i+1} · ${x.system} rank ${sl.rank} · ${sl.id}`)}"><figcaption>${s}-${i+1} · rank ${sl.rank}<br>${esc(sl.id)}</figcaption></figure>`).join('')}</div></div>`;
}
function render(){
  const fs=fSys.value,fd=fDx.value,fb=fBin.value,fr=fResp.value,ft=fTxt.value.trim().toUpperCase();
  const list=D.filter(it=>(!fs||it.A.system===fs||it.B.system===fs)&&(!fd||it.diagnosis===fd)&&(!fb||it.bin===fb)
    &&(!ft||(it.id+' '+it.query+' '+it.A.slides.map(s=>s.id).join(' ')+' '+it.B.slides.map(s=>s.id).join(' ')).toUpperCase().includes(ft))
    &&(!fr||(fr==='has'?it.resp.length:it.resp.some(r=>{const q=fr.endsWith('1')?r.q1:r.q2;return (q==='A'||q==='B')&&((q===it.pref)===fr.startsWith('agree'));}))));
  cnt.textContent=`${list.length} / ${D.length} 문항`;
  document.getElementById('list').innerHTML=list.map(it=>`<section class="card"><div class="ch"><b>#${it.seq}</b><span class="tag">item ${it.id}</span><span>${esc(it.project)} · ${esc(it.diagnosis)}</span>
  <span class="tag">|ΔL2a| ${it.delta.toFixed(4)} (${it.bin})</span><span class="tag">Layer 2a 선호: ${it.pref} (${esc(it[it.pref].system)})</span></div>
  <div class="grid"><div class="q"><div class="muted" style="font-size:12px">Query · ${esc(it.query)}</div><img loading="lazy" src="${im(it.query_img,'thumb')}" data-img="${it.query_img}" data-cap="Query · ${esc(it.query)}" style="cursor:zoom-in"></div>${setHtml(it,'A')}${setHtml(it,'B')}</div>
  ${it.resp.length?`<table class="resp"><tr><th>판독자</th><th>Q1 형태</th><th>확신</th><th>Layer2a</th><th>Q2 유용성</th><th>확신</th><th>Layer2a</th><th>시간</th></tr>${it.resp.map(r=>`<tr><td>${esc(r.reader)}</td><td>${L[r.q1]}${sysName(it,r.q1)?` (${esc(sysName(it,r.q1))})`:''}</td><td>${r.q1_conf||'—'}</td><td>${verdict(it,r.q1)}</td><td>${L[r.q2]}${sysName(it,r.q2)?` (${esc(sysName(it,r.q2))})`:''}</td><td>${r.q2_conf||'—'}</td><td>${verdict(it,r.q2)}</td><td>${r.sec}s</td></tr>`).join('')}</table>`:'<div class="muted" style="margin-top:6px">응답 없음</div>'}</section>`).join('');
}
document.addEventListener('click',e=>{const t=e.target.closest('img[data-img]');if(!t)return;const id=t.dataset.img;
  dlg.innerHTML=`<div style="color:#fff;margin-bottom:4px">${t.dataset.cap}</div><img src="${im(id,'thumb')}"><div class="pp">${[1,2,3,4].map(i=>`<img src="${im(id,'p'+i)}" onerror="this.remove()">`).join('')}</div>`;dlg.showModal();});
dlg.addEventListener('click',()=>dlg.close());
for(const el of[fSys,fDx,fBin,fResp])el.onchange=render;fTxt.oninput=render;

gf.onsubmit=async e=>{e.preventDefault();gerr.textContent='';
  try{await load(gpw.value);}catch(err){gerr.textContent=/admin password/.test(err.message)?'비밀번호가 틀렸습니다.':'불러오기 실패: '+err.message;return;}
  try{sessionStorage.setItem('rs_admin_pw',gpw.value);}catch{}
  gate.hidden=true;app.hidden=false;
  for(const s of [...new Set(D.flatMap(i=>[i.A.system,i.B.system]))].sort())fSys.add(new Option(s,s));
  for(const d of [...new Set(D.map(i=>i.diagnosis))].sort())fDx.add(new Option(d,d));
  summary();render();};
document.getElementById('reload').onclick=async()=>{let pw='';try{pw=sessionStorage.getItem('rs_admin_pw')||'';}catch{}
  if(!pw)return location.reload();await load(pw);summary();render();};
try{const pw=sessionStorage.getItem('rs_admin_pw');if(pw){gpw.value=pw;gf.requestSubmit();}}catch{}
</script></body></html>
